user  _www;
worker_processes auto;
pid /Users/hiboranez/WebstormProjects/NER-Web/run/nginx.pid;
error_log /Users/hiboranez/WebstormProjects/NER-Web/nginx/logs/error.log warn;

events {
    worker_connections  10240;
    multi_accept        on;
}

http {
    # 基础
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 10000;
    server_tokens off;
    etag on;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$request_time" '
                    '"$upstream_addr" "$upstream_status" "$upstream_response_time"';

    # 压缩
    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml
        image/svg+xml;

    # (可选) Brotli 模块存在再取消注释
    # brotli on;
    # brotli_comp_level 5;
    # brotli_static on;
    # brotli_types
    #     text/plain text/css text/xml
    #     application/json application/javascript application/xml
    #     application/rss+xml application/atom+xml
    #     image/svg+xml
    #     font/ttf font/otf application/vnd.ms-fontobject;

    # WebSocket 连接头
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 静态缓存策略
    map $uri $static_cache_control {
        default "public, max-age=300";
      ~*^/assets/ "public, max-age=31536000, immutable";
    }

    # 后端上游
    upstream django_app {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    # 80: 跳转与 ACME
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ACME 验证目录
        location ^~ /.well-known/acme-challenge/ {
            root /Users/hiboranez/WebstormProjects/NER-Web/etc/acme-root;
            default_type "text/plain";
            allow all;
        }

        # 若证书已就绪，统一跳转 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 443: 主站 (请确保证书路径存在)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        # 证书 (已用自签示例；换成正式证书)
        ssl_certificate     /Users/hiboranez/WebstormProjects/NER-Web/etc/certs/server.crt;
        ssl_certificate_key /Users/hiboranez/WebstormProjects/NER-Web/etc/certs/server.key;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_tickets off;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # 前端构建目录
        root  /Users/hiboranez/WebstormProjects/NER-Web/frontend/dist;
        index index.html;

        access_log /Users/hiboranez/WebstormProjects/NER-Web/nginx/logs/access.log main;
        error_log  /Users/hiboranez/WebstormProjects/NER-Web/nginx/logs/error.log warn;

        # 安全响应头
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-XSS-Protection "0" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss: https:; object-src 'none'; frame-ancestors 'self'; base-uri 'self';" always;

        # 根: SPA 回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 构建产物 (长缓存)
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control $static_cache_control;
        }

        # 上传文件目录 (短缓存)
        location /uploads/ {
            alias /Users/hiboranez/WebstormProjects/NER-Web/backend/uploads/;
            add_header Cache-Control "public, max-age=60";
            autoindex off;
        }

        # API
        location /api/ {
            proxy_pass http://django_app;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
            client_max_body_size 32m;
            proxy_read_timeout 120s;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://django_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout 300s;
        }

        # Favicon / robots
        location = /favicon.ico { access_log off; log_not_found off; add_header Cache-Control "public, max-age=86400"; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # 隐藏敏感点 (保留 ACME)
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
